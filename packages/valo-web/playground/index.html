<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0c" />
    <title>Valo — WebGPU 2D</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#overview" aria-label="Valo home">
        <span class="mark"></span>
        <span>valo</span>
      </a>
      <div class="status"><span id="status-dot"></span><span id="status">starting WebGPU</span></div>
      <a class="source" href="https://github.com/tyxu/valo">source ↗</a>
    </header>

    <main>
      <aside>
        <p class="eyebrow">PLAYGROUND</p>
        <nav id="chapters" aria-label="Demo chapters"></nav>
        <div class="api-note">
          <span>API</span>
          <strong id="api-kind">raw wasm</strong>
        </div>
      </aside>

      <section class="stage">
        <div class="intro">
          <div>
            <p class="chapter-number" id="chapter-number">01 / 05</p>
            <h1 id="title">One engine.<br />Every surface.</h1>
          </div>
          <p id="description"></p>
        </div>

        <div class="canvas-shell">
          <canvas id="valo" width="1120" height="680"></canvas>
          <div class="canvas-label">WEBGPU</div>
          <div class="stats" id="stats">waiting for first frame</div>
          <div class="error" id="error" hidden></div>
        </div>

        <footer class="chapter-footer">
          <span id="hint"></span>
          <div class="pager">
            <button id="previous" aria-label="Previous chapter">←</button>
            <button id="next" aria-label="Next chapter">→</button>
          </div>
        </footer>
      </section>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
