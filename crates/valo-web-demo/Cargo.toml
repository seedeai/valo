# The interactive board in a real browser: canvas + WebGPU + RAF loop, no
# winit — the same integration shape a host app uses to embed valo.
# Build: wasm-pack build crates/valo-web-demo --target web --release
[package]
name = "valo-web-demo"
version = "0.2.2"
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
valo = { workspace = true }
valo-harness = { workspace = true }
wgpu = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "PointerEvent",
    "WheelEvent",
    "DomRect",
] }
