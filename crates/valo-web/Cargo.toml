[package]
name = "valo-web"
description = "WebAssembly bindings for the Valo 2D renderer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
valo = { workspace = true }
wgpu = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
    "HtmlCanvasElement",
    "HtmlImageElement",
    "HtmlVideoElement",
    "ImageBitmap",
    "ImageData",
    "OffscreenCanvas",
    "VideoFrame",
] }

[features]
# The compat build: keeps the WebGPU backend and adds wgpu's WebGL2 backend,
# so the same binary falls back where WebGPU is missing. WebGL is one context
# per canvas, so `Device.attach` allows a single canvas on that path — and the
# GLSL transpiler roughly doubles the wasm, which is why this is a separate
# artifact instead of the default.
webgl = ["wgpu/webgl"]
