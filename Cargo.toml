# valo — a 2D render engine in Rust on wgpu. A display list is recorded with a
# record-time oracle (bounds, depth slots), planned into GPU passes, and drawn
# alongside a Skia-shaped text stack. See AGENTS.md for how the project works.
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.4.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/seedeai/valo"
readme = "README.md"
# wgpu 30 sets the floor; verified in CI.
rust-version = "1.87"
keywords = ["graphics", "gpu", "wgpu", "2d", "renderer"]
categories = ["graphics", "rendering::engine"]

[workspace.dependencies]
# internal — path + version, because crates.io drops the path and needs the
# version. valo-harness stays version-less on purpose: it is dev-only and a
# version-less dev-dependency is stripped at publish instead of published.
valo-geometry = { path = "crates/valo-geometry", version = "0.4.2" }
valo-dl = { path = "crates/valo-dl", version = "0.4.2" }
valo-text = { path = "crates/valo-text", version = "0.4.2" }
valo-renderer = { path = "crates/valo-renderer", version = "0.4.2" }
valo-harness = { path = "crates/valo-harness" }
valo = { path = "crates/valo", version = "0.4.2" }
valo-svg = { path = "crates/valo-svg", version = "0.4.2" }
valo-fontmgr = { path = "crates/valo-fontmgr", version = "0.4.2" }
valo-system-fonts = { path = "crates/valo-system-fonts", version = "0.4.2" }
valo-codec = { path = "crates/valo-codec", version = "0.4.2" }
# gpu — wgpu IS the HAL (no layer over it)
wgpu = "30"
# text — one crate per role in Skia's stack, each an intended swap seam:
# shaping (HarfBuzz's role -> harfrust), font parsing (skrifa), glyph raster
# (swash), ICU's line breaks + bidi (unicode-*), atlas packing (etagere)
harfrust = "0.4"
skrifa = "0.35"
swash = "0.2"
unicode-bidi = "0.3"
unicode-linebreak = "0.1"
unicode-segmentation = "1"
# installed fonts: the platform's font API where it has one (CoreText), else a
# directory scan (fontdb) — native hosts only, never a wasm dependency
fontdb = "0.23"
core-text = "21"
core-graphics = "0.24"
foreign-types = "0.5"
memmap2 = "0.9"
core-foundation = "0.10"
core-foundation-sys = "0.8"
rustc-hash = "2"
# image decoding — only valo-codec-software links it into a shipping crate;
# elsewhere it encodes test fixtures. That crate picks formats per feature.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
etagere = "0.2"
bytemuck = { version = "1", features = ["derive"] }
# 4x4 matrices: column-major f32, Flutter/Impeller-identical layout,
# SIMD native + wasm-clean (SIMD128 opt-in)
glam = "0.30"
# opt-in observability: serde dump + tracing spans, both feature-gated
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tracing = "0.1"
# dev: native bring-up + goldens + examples (no browser anywhere)
pollster = "0.4"
png = "0.17"
winit = "0.30"

[profile.release]
opt-level = 3
lto = "thin"
